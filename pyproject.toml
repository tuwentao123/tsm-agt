[project]
name = "tsm-agt"
version = "0.1.0"
description = "A pluggable engineering agent harness built with Ports and Adapters"
requires-python = ">=3.12,<3.13"
dependencies = [
    "prompt-toolkit==3.0.52",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[project.scripts]
tsm-agt = "tsm_agt.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsm_agt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

